# =========================================================
# APPLICATION CONFIGURATION
# =========================================================
spring.application.name=FinancialTransactionProcessingService

server.port=8080

# =========================================================
# DATABASE CONFIGURATION (MYSQL)
# =========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/financial_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA / HIBERNATE CONFIGURATION
# =========================================================
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# =========================================================
# CONNECTION POOL CONFIGURATION (HIKARI)
# =========================================================
spring.datasource.hikari.pool-name=FinancialHikariCP
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# =========================================================
# LOGGING CONFIGURATION
# =========================================================
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.com.financial.transaction=DEBUG

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# =========================================================
# SWAGGER / OPENAPI CONFIGURATION
# =========================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# =========================================================
# JACKSON CONFIGURATION
# =========================================================
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
spring.jackson.time-zone=Asia/Kolkata

# =========================================================
# ASYNC CONFIGURATION
# =========================================================
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100

# =========================================================
# SCHEDULER CONFIGURATION
# =========================================================
spring.task.scheduling.pool.size=5

# =========================================================
# FILE UPLOAD CONFIGURATION
# =========================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =========================================================
# ACTUATOR CONFIGURATION
# =========================================================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# =========================================================
# CUSTOM APPLICATION CONFIGURATION
# =========================================================

# Fraud Detection Max Amount
app.fraud.max-transaction-limit=100000

# Retry Scheduler
app.retry.max-attempts=3

# Default Currency
app.default-currency=INR

# Idempotency Expiry (Minutes)
app.idempotency.expiry-minutes=30

# =========================================================
# BANNER CONFIGURATION
# =========================================================
spring.main.banner-mode=console

# =========================================================
# DEVTOOLS CONFIGURATION
# =========================================================
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true